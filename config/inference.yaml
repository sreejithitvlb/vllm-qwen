# Performance/Inference optimization configuration
# https://docs.vllm.ai/en/latest/performance_tuning.html

# GPU memory management
gpu_memory_utilization: 0.83  # Percentage of GPU memory to use (0.0-1.0)
swap_space: 0                  # CPU swap space (GB) for overflow

# Throughput & latency tuning
max_num_seqs: 32               # Maximum number of sequences per batch
tensor_parallel_size: 1        # Distributed inference across GPUs

# Caching & optimization
enable_prefix_caching: true    # Enable prefix caching for repeated prompts
