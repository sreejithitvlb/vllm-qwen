# SchedulerConfig - Batching and throughput configuration
# https://docs.vllm.ai/en/latest/

# Throughput & latency tuning
max_num_seqs: 32               # Max concurrent sequences in a batch
max_num_batched_tokens: 2048  # Token budget per scheduler step
enable_chunked_prefill: true  # Split long prompts so they don't stall decoding
